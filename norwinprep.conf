# NorwinPrep configuration (installed to /etc/norwinprep.conf)
SSID="NorwinPrep"
# WPA2 passphrase, min 8 chars. Set PASSWORD="" for an open network.
PASSWORD="prepared123"
WIFI_IFACE="wlan0"
HOSTNAME_NEW="norwinprep"
# Friendly device name shown in the NorwinPrep apps (letters, numbers, spaces . _ - ( ), max 40)
DEVICE_NAME="NorwinPrep"
# Where offline content lives (put an external SSD here by mounting it at this path)
CONTENT_DIR="/srv/norwinprep/content"

# --- Updates (only run when the Pi has internet, e.g. Ethernet plugged in) ---
AUTO_UPDATE_OS=1            # Debian / Raspberry Pi OS package updates
AUTO_UPDATE_SOFTWARE=1      # NorwinPrep code updates from GitHub
AUTO_UPDATE_CONTENT=1       # refresh Kiwix content to newest editions
CONTENT_TIER="survival"     # survival | small | medium | large
UPDATE_CHANNEL="stable"     # stable = latest vX.Y.Z release, edge = main branch
UPDATE_REPO="https://github.com/NorwinLabs/NorwinPrepDisk.git"
UPDATE_TOKEN=""             # only needed if the repo is private (read-only token)
