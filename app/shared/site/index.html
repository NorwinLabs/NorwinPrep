<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Module Store &ndash; NorwinPrep</title>
<style>
  :root{
    --bg:#0d0f14; --panel:#12151c; --line:#272b36; --line2:#363c4b; --text:#e9ebf1; --mut:#8b92a3;
    --blue:#4aa3ff; --red:#ff5a6e; --green:#58d68d; --amber:#f0b84a;
    --r-lg:20px; --r:16px; --r-md:12px; --r-sm:10px; --pill:999px;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans)}
  button,input,select{font:inherit;color:inherit}
  a{color:inherit}
  .mono{font-family:var(--mono);letter-spacing:.18em;text-transform:uppercase;font-size:11px}

  /* ---------- top bar ---------- */
  header{height:48px;display:flex;align-items:center;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:20;padding:0 8px 0 0}
  .brand{display:flex;align-items:center;padding:0 18px;text-decoration:none;font-weight:800;font-size:18px;letter-spacing:.1em;height:100%}
  .brand i{font-style:normal;margin-right:8px;display:inline-block;width:16px;height:16px;border:2px solid #fff;border-radius:5px;transform:rotate(45deg) scale(.85)}
  .sub{display:flex;align-items:center;padding:0 18px;border-left:1px solid var(--line);color:var(--mut);letter-spacing:.28em;height:24px}
  .spacer{flex:1}
  .iconbtn{position:relative;width:40px;height:34px;margin-left:4px;border:1px solid transparent;border-radius:var(--r-sm);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--mut)}
  .iconbtn:hover{color:#fff;background:#1a1f2a;border-color:var(--line2)}

  /* ---------- toolbar ---------- */
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:16px}
  .sq{height:36px;min-width:36px;border:1px solid var(--line2);border-radius:var(--r-sm);background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 12px}
  .sq:hover{border-color:#6b7488}
  .sq.on{background:#fff;color:#0d0f14;border-color:#fff}
  .sq svg{width:16px;height:16px}
  .chips{max-width:100%;overflow-x:auto;scrollbar-width:none;display:flex;gap:3px;padding:3px;border:1px solid var(--line2);border-radius:var(--r-md);background:#10131a}
  .chips .sq{flex:none;border:0;border-radius:9px;height:28px;min-width:0;padding:0 13px;letter-spacing:.14em}
  .chips .sq:hover{background:#1a1f2a}
  .chips .sq.on:hover{background:#fff}
  .sortlbl{color:var(--mut);margin-left:auto}
  select,input[type=search],input[type=password],input[type=text]{height:36px;background:var(--panel);border:1px solid var(--line2);padding:0 14px;border-radius:var(--r-sm);outline:none}
  select{min-width:150px}
  input[type=search]{width:min(210px,100%)}
  select:focus,input:focus,.sq:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .spin svg{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  main{padding:0 16px 64px;margin:0 auto}   /* width is set in fitColumns() to a whole number of columns, so the space left over is equal on both sides */
  .tiers{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
  .tier{border:1px solid var(--line);border-radius:var(--r);background:#0f1218;padding:16px;display:flex;flex-direction:column;gap:8px}
  .tier h3{margin:0;font-size:18px}
  .tier p{margin:0;color:var(--mut);font-size:13px;flex:1}
  .tier .meta{font-size:12px;color:var(--mut)}
  .tier ul{margin:8px 0;padding-left:18px;max-height:34vh;overflow:auto}
  .section{margin:24px 0 12px;color:var(--mut)}
  .section b{color:var(--text);font-weight:600}

  /* ---------- cards ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,376px);gap:16px;justify-content:start}
  .card{border:1px solid var(--line);border-radius:var(--r);background:#0f1218;display:flex;flex-direction:column;min-height:340px;position:relative}
  .card.dim{opacity:.6}
  .top{display:flex;justify-content:space-between;align-items:center;padding:0 20px;height:42px;border-bottom:1px solid var(--line)}
  .ver{color:var(--blue)} .ver.upd{color:var(--red)}
  .src{color:var(--mut);text-decoration:none;border-radius:6px} .src:hover{color:#fff}
  .body{padding:18px 20px 20px;display:flex;flex-direction:column;flex:1;min-width:0}
  .head{display:flex;gap:16px;align-items:center}
  .icon{width:56px;height:56px;border-radius:15px;flex:none;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px #ffffff22,0 4px 14px #0008}
  .icon svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .titles{min-width:0}
  .title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:22px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
  .title .n2{opacity:.95}
  .by{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--blue);border:1px solid #2a4a73;background:#10233b55;padding:2px 9px;border-radius:var(--pill);text-transform:uppercase;font-weight:500}
  .tag{color:var(--mut);margin-top:3px;font-size:14.5px}
  .avail{margin-top:16px}
  .pill{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--blue);border:1px solid #2a4a73;background:#10233b55;padding:3px 10px;border-radius:var(--pill);text-transform:uppercase;display:inline-block}
  .pill.warn{color:var(--red);border-color:#7a2a36;background:#3b101855}
  .desc{margin:14px 0 0;font-size:14.5px;color:#d3d7e0}
  .facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .fact{border:1px solid var(--line);background:#10131a;border-radius:var(--r-md);padding:8px 12px;min-width:0}
  .fact .k{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--mut);text-transform:uppercase}
  .fact .v{font-weight:600;font-size:15px;margin-top:2px;overflow-wrap:anywhere}
  .fact .v small{display:block;color:var(--mut);font-weight:400;font-size:11px;margin-top:1px;letter-spacing:.02em}
  .fact.bad{border-color:#7a2a36;background:#2a1015} .fact.bad .v{color:#ff9aa6} .fact.bad .v small{color:#ff9aa6}
  .meta{margin-top:10px;font-size:13px;color:var(--mut)}
  .actions{margin-top:auto;padding-top:20px;display:flex;gap:10px;align-items:stretch}
  .btn{flex:1;height:38px;border:1px solid var(--line2);border-radius:var(--r-sm);background:transparent;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;padding:0 12px}
  .btn:hover{border-color:#fff}
  .btn.solid{background:#fff;color:#0d0f14;border-color:#fff} .btn.solid:hover{background:#dfe3ea}
  .btn.warn{border-color:var(--red);color:var(--red)} .btn.warn:hover{background:#3b101855}
  .btn:disabled{opacity:.45;cursor:default} .btn:disabled:hover{border-color:var(--line2)} .btn.solid:disabled:hover{background:#fff;border-color:#fff}
  .more{flex:none;width:40px;height:38px;border:1px solid var(--line2);border-radius:var(--r-sm);background:transparent;cursor:pointer;color:var(--mut);letter-spacing:.1em}
  .more:hover{color:#fff;border-color:#fff}
  .menu{position:absolute;right:20px;bottom:66px;background:#161a23;border:1px solid var(--line2);border-radius:var(--r-md);padding:5px;min-width:190px;z-index:10;box-shadow:0 12px 32px #000c;display:none}
  .menu.open{display:block}
  .menu button,.menu a{display:block;width:100%;text-align:left;padding:9px 12px;background:transparent;border:0;border-radius:8px;cursor:pointer;text-decoration:none;font-size:14px}
  .menu button:hover,.menu a:hover{background:#222836}
  .menu .danger{color:var(--red)}
  .prog{flex:1;min-width:0}
  .prog .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar{height:8px;background:#1b1f2a;border-radius:var(--pill);margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--blue);border-radius:var(--pill);transition:width .4s}
  .bar.ind i{width:35%;animation:slide 1.4s ease-in-out infinite}
  @keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}
  .err{flex:1;font-size:13px;color:var(--red);min-width:0;overflow-wrap:anywhere}

  /* ---------- list view ---------- */
  .grid.list{grid-template-columns:1fr;gap:12px}
  .list .card{min-height:0;flex-direction:row;align-items:center}
  .list .top{flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;height:auto;border-bottom:0;border-right:1px solid var(--line);width:128px;align-self:stretch;flex:none}
  .list .body{flex-direction:row;align-items:center;gap:20px;padding:12px 20px;flex-wrap:wrap}
  .list .head{flex:1 1 280px}
  .list .avail,.list .meta{display:none}
  .list .desc{margin:0;flex:2 1 260px;font-size:13.5px}
  .list .facts{margin:0;flex:0 1 310px}
  .list .actions{margin:0;padding:0;flex:0 0 240px}
  .list .menu{bottom:auto;top:calc(100% - 8px)}

  /* ---------- modal ---------- */
  .veil{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
  .veil.open{display:flex}
  .modal{width:min(480px,100%);max-height:88vh;overflow:auto;background:#12151c;border:1px solid var(--line2);border-radius:var(--r-lg);box-shadow:0 20px 60px #000}
  .modal h3{margin:0;padding:18px 22px;border-bottom:1px solid var(--line);font-size:17px}
  .modal .mb{padding:18px 22px}
  .modal .mf{display:flex;gap:10px;padding:0 22px 22px}
  .kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:14px;margin:0}
  .kv dt{color:var(--mut)} .kv dd{margin:0;overflow-wrap:anywhere}
  .note{color:var(--mut);font-size:13px;margin-top:12px}
  .bad{color:var(--red)} .okc{color:var(--green)}
  .field{width:100%;margin-top:10px;font-family:var(--mono);letter-spacing:.3em;font-size:18px;text-align:center}
  .empty{padding:60px 16px;text-align:center;color:var(--mut)}
  .empty h2{color:var(--text);margin:0 0 6px}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1b2030;border:1px solid var(--line2);border-radius:var(--r-md);padding:10px 18px;z-index:60;display:none;max-width:90vw}
  .gauge{height:10px;background:#1b1f2a;border-radius:var(--pill);margin:10px 0;overflow:hidden}
  .gauge i{display:block;height:100%;background:var(--blue);border-radius:var(--pill)}

  .cdot{position:absolute;right:6px;top:6px;width:8px;height:8px;border-radius:50%;background:#555;box-sizing:content-box;border:2px solid var(--bg)}
  .cdot.on{background:var(--green)} .cdot.warn{background:var(--amber)} .cdot.off{background:var(--red)}
  #hdrTools{display:flex}
  .connbar{margin:0 16px 4px;border:1px solid var(--line2);border-radius:var(--r-md);padding:10px 14px;display:none;align-items:center;gap:12px;font-size:14px;color:var(--mut)}
  .connbar.show{display:flex} .connbar.bad{border-color:#7a2a36;color:#ff9aa6} .connbar .grow{flex:1;min-width:0;overflow-wrap:anywhere}
  .opt{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
  .opt:last-child{border-bottom:0} .opt .grow{flex:1;min-width:0}
  .opt .t{font-weight:600;overflow-wrap:anywhere} .opt .d{color:var(--mut);font-size:13px;overflow-wrap:anywhere}
  .dot{width:10px;height:10px;border-radius:50%;background:#555;flex:none} .dot.on{background:var(--green)} .dot.warn{background:var(--amber)} .dot.off{background:var(--red)}
  .tagon{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--green);border:1px solid #1f5a3a;border-radius:var(--pill);padding:2px 10px;text-transform:uppercase}
  .sumbox{border:1px solid var(--line2);border-radius:var(--r-md);padding:12px 14px;margin-bottom:12px;background:#10131a}
  .sumbox b{color:#fff}
  .addr{display:flex;gap:8px;margin-top:12px} .addr input{flex:1;min-width:0}
  .btn.sm{flex:none;height:32px;padding:0 14px}
  #ver{position:fixed;right:12px;bottom:10px;z-index:40;background:var(--panel);color:var(--mut);border:1px solid var(--line2);border-radius:var(--pill);padding:5px 14px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;cursor:pointer}
  #ver:hover{color:#fff;border-color:#fff} #ver.new{color:var(--green);border-color:var(--green)}
  #upd{position:fixed;right:12px;bottom:48px;z-index:45;width:min(92vw,350px);display:none;background:#12151c;border:1px solid var(--line2);border-radius:var(--r);padding:14px 16px;box-shadow:0 8px 28px #000b}
  #upd .bar{height:8px;margin-top:10px} #upd .bar i{transition:width .3s}
  body.home .toolbar{display:none}
  #dlbtn{position:fixed;left:12px;bottom:10px;z-index:40;display:none;background:var(--panel);color:#fff;border:1px solid var(--line2);border-radius:var(--pill);padding:6px 14px;font-size:13px;cursor:pointer}
  #dlbtn:hover{border-color:#fff} #dlbtn.busy{border-color:var(--green)}
  #stbtn{position:fixed;left:12px;bottom:10px;z-index:40;display:none;background:var(--panel);color:#fff;border:1px solid var(--line2);border-radius:var(--pill);padding:6px 14px;font-size:13px;cursor:pointer}
  #stbtn:hover{border-color:#fff} body.hasdl #dlbtn{left:150px}
  #stpanel{position:fixed;left:12px;bottom:48px;z-index:46;width:min(94vw,440px);max-height:78vh;overflow:auto;display:none;background:#12151c;border:1px solid var(--line2);border-radius:var(--r);padding:14px 16px;box-shadow:0 8px 28px #000b}
  #stpanel h3{margin:0 0 8px;font-size:15px} #stpanel h4{margin:16px 0 6px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);font-family:var(--mono)}
  .strow{display:flex;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line);font-size:13px} .strow span.n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .strow span.s{color:var(--mut);font-family:var(--mono);font-size:12px}
  .stbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:6px 0} .stbar i{display:block;height:100%;background:var(--blue)} .stbar.low i{background:var(--red)}
  .stopt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0;font-size:13px} .stopt select{background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:8px;height:28px}
  .stwarn{border:1px solid #5a2630;background:#2a1217;color:#ffb3bd;border-radius:10px;padding:8px 10px;margin:8px 0;font-size:13px}
  #dlpanel{position:fixed;left:12px;bottom:48px;z-index:45;width:min(94vw,420px);max-height:70vh;overflow:auto;display:none;background:#12151c;border:1px solid var(--line2);border-radius:var(--r);padding:14px 16px;box-shadow:0 8px 28px #000b}
  #dlpanel h3{margin:0 0 8px;font-size:15px} #dlpanel .grp{margin:12px 0 4px;color:var(--mut)}
  .dlrow{display:flex;flex-direction:column;gap:4px;padding:8px 0;border-top:1px solid var(--line)}
  .dlrow:first-of-type{border-top:0}
  .dlrow .top{display:flex;gap:8px;align-items:center} .dlrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  .dlrow .st{color:var(--mut);font-size:12px} .dlrow .st.bad{color:#ff8a98}
  .dlrow .bar{height:6px}
  .hero{text-align:center;padding:18px 0 6px} .hero h1{margin:0;font-size:28px;letter-spacing:-.01em} .hero p{margin:6px 0 0;color:var(--mut)}
  .big{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:18px}
  .tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px;padding:18px 12px;border:1px solid var(--line2);border-radius:var(--r);background:#0f1218;color:inherit;text-decoration:none;cursor:pointer;text-align:center;font:inherit}
  .tile:hover,.tile:focus-visible{border-color:#fff;outline:0}
  .tile svg{width:38px;height:38px} .tile b{font-size:18px} .tile small{color:var(--mut);font-size:13px}
  .tile.off{opacity:.55} .tile.off small{color:var(--green)}
  .addbar{display:flex;justify-content:center;margin:22px 0 4px}
  .addbar .btn{font-size:16px;padding:12px 26px}
  .topics{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
  .topic{border:1px solid var(--line);border-radius:var(--r);background:#0f1218;padding:16px;display:flex;flex-direction:column;gap:8px}
  .topic h3{margin:0;font-size:16px} .topic p{margin:0;color:var(--mut);font-size:13px}
  .topic .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
  @media (max-width:440px){ .grid{grid-template-columns:1fr} .sub{display:none} .sortlbl{display:none} }
  @media (max-width:760px){ .list .card{flex-direction:column;align-items:stretch} .list .top{width:auto;flex-direction:row;border-right:0;border-bottom:1px solid var(--line);height:42px;align-items:center} .list .actions,.list .facts{flex:1 1 auto} }
</style>
</head>
<body>
<header>
  <a class="brand" href="/" id="brand" aria-label="NorwinPrep home"><i></i>NORWINPREP</a>
  <div class="sub mono" id="where">Home</div>
  <div class="spacer"></div>
  <div id="hdrTools"></div>
  <button class="iconbtn" id="gear" aria-label="Settings" title="Settings">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<div class="toolbar">
  <button class="sq" id="refresh" aria-label="Check for new versions" title="Check for new versions">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
  </button>
  <div class="chips" role="group" aria-label="Filter by type" id="chips">
    <button class="sq mono on" data-t="all">All</button>
    <button class="sq mono" data-t="installed" id="chipInstalled">Installed</button>
    <button class="sq mono" data-t="maps">Maps</button>
    <button class="sq mono" data-t="survival">Survival</button>
    <button class="sq mono" data-t="water">Water</button>
    <button class="sq mono" data-t="cooking">Cooking</button>
    <button class="sq mono" data-t="electronics">Electronics</button>
    <button class="sq mono" data-t="coding">Coding</button>
    <button class="sq mono" data-t="dictionary">Dictionary</button>
    <button class="sq mono" data-t="reference">Wikipedia</button>
    <button class="sq mono" data-t="ai">AI</button>
    <button class="sq mono" data-t="tools">Tools</button>
    <button class="sq mono" data-t="apps">Apps</button>
  </div>
  <span class="sortlbl mono">Sort</span>
  <select id="sort" aria-label="Sort modules">
    <option value="name">Name (A-Z)</option>
    <option value="namez">Name (Z-A)</option>
    <option value="type">Type</option>
    <option value="updated">Recently updated</option>
  </select>
  <input type="search" id="q" placeholder="Search modules" aria-label="Search modules" autocomplete="off">

</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var API = '/api/modules';
  var base = '';          // '' = same origin (page served by a NorwinPrep device); otherwise the connected device's address
  var browse = false;     // inside an app with no device connected: show the bundled catalog, install disabled
  var offline = false;    // connected device could not be reached
  var IS_APP = false;     // served by an app's local instance (has the connections icon)
  var localMgr = false;   // installs happen on THIS device (the app's own module manager; no PIN needed)
  var devPlatform = '';   // windows / linux / darwin / android, when running inside an app
  function pinKey() { return 'norwinprep.pin' + (base ? '@' + base : ''); }
  var H = { 'X-NorwinPrep': '1' };
  var state = { mods: [], disk: null, type: 'all', sort: 'name', q: '', view: 'grid', sig: '', home: true, topics: [], showHidden: false, pending: false, sizeTries: 0 };
  var pollTimer = null;
  // power saving: a hidden window or tab does not poll; it catches up the moment it is shown again

  // ---------- icons ----------
  var GLYPH = {
    cross: '<path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/>',
    drop: '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
    shield: '<path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
    leaf: '<path d="M5 19c0-9 6-14 15-14 0 9-5 15-14 15"/><path d="M5 19c3-5 6-8 10-10"/>',
    compass: '<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
    book: '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19a2 2 0 0 1 2-2h13"/>',
    wrench: '<path d="M14.7 6.3a4 4 0 0 0 5 5L21 12.6 12.6 21 3 11.4 11.4 3z" transform="scale(.9) translate(1.5 1.5)"/><path d="M8 16l-3 3"/>',
    chip: '<rect x="6" y="6" width="12" height="12" rx="1"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
    globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
    map: '<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>',
    phone: '<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
    desktop: '<rect x="3" y="4" width="18" height="12" rx="1"/><path d="M8 20h8M12 16v4"/>'
  };
  function shade(hex, amt) {
    var n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    function c(v) { return Math.max(0, Math.min(255, Math.round(v + amt))); }
    return 'rgb(' + c(r) + ',' + c(g) + ',' + c(b) + ')';
  }
  function iconEl(m) {

    var col = /^#[0-9a-fA-F]{6}$/.test(m.color) ? m.color : '#4a6fd9';
    d.style.background = 'linear-gradient(150deg,' + shade(col, 35) + ',' + shade(col, -45) + ')';
    d.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + (GLYPH[m.icon] || GLYPH.book) + '</svg>';   // GLYPH is a fixed local table
    return d;
  }

  // ---------- small helpers ----------
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
  function human(n) {
    if (n === null || n === undefined) return 'unknown';
    var u = ['B', 'KB', 'MB', 'GB', 'TB'], i = 0; n = Number(n);
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return (i === 0 ? n.toFixed(0) : n.toFixed(1)) + ' ' + u[i];
  }
  function fmtDate(sec) { return new Date(sec * 1000).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }
  function toast(msg) { var t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { t.style.display = 'none'; }, 4200); }
  function api(method, path, body, pin, toLocal) {
    var h = Object.assign({}, H);

      return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.error || ('Request failed (' + r.status + ')')); e.status = r.status; throw e; } return j; });
    });
  }
  // ---------- hiding modules (a personal preference, kept in this browser/app) ----------
  var HID_KEY = 'norwinprep.hidden';
  function hiddenIds() { try { var a = JSON.parse(store(HID_KEY) || '[]'); return Array.isArray(a) ? a.filter(function (x) { return typeof x === 'string'; }) : []; } catch (e) { return []; } }

  function setHidden(id, on) { var a = hiddenIds().filter(function (x) { return x !== id; }); if (on) a.push(id); store(HID_KEY, JSON.stringify(a)); }
  function hiddenCount() { return state.mods.filter(function (m) { return isHidden(m.id); }).length; }

  // ---------- sizes: exact when the device has looked them up, otherwise a labelled estimate ----------

  function sizeInfo(m) {
    var exact = m.installed ? (m.bytes === undefined ? null : m.bytes) : (m.size || null);
    if (exact === null && m.approxMB) exact = m.approxMB * 1048576;   // imported maps carry a published approximate size

    return { exact: exact, cls: cls, free: free,
      noSpace: !m.installed && free !== null && exact !== null && need > free,            // we know it will not fit

  }
  function factsEl(m) {
    var s = sizeInfo(m), f = el('div', 'facts');
    var a = el('div', 'fact'); a.appendChild(el('div', 'k', m.installed ? 'Size on disk' : 'Install size'));
    var av = el('div', 'v');
    if (s.exact !== null) av.textContent = human(s.exact);
    else if (s.cls) {
      av.textContent = '\u2248 ' + s.cls.label;
      av.appendChild(el('small', null, state.pending && m.type !== 'maps' ? 'checking exact size\u2026' : 'estimate'));
      av.title = 'A rough estimate. The exact size appears once the device can look it up.';
    } else av.textContent = 'unknown';
    a.appendChild(av); f.appendChild(a);
    var b = el('div', 'fact' + (s.noSpace || s.mayNot ? ' bad' : '')); b.appendChild(el('div', 'k', 'Space left'));
    var bv = el('div', 'v');
    if (s.free !== null) { bv.textContent = human(s.free); if (s.noSpace) bv.appendChild(el('small', null, 'not enough')); else if (s.mayNot) bv.appendChild(el('small', null, 'may not fit')); }
    else { bv.textContent = '\u2014'; bv.appendChild(el('small', null, 'connect a device')); }
    b.appendChild(bv); f.appendChild(b);
    return f;
  }
  var CATS = ['maps', 'survival', 'water', 'cooking', 'electronics', 'coding', 'dictionary', 'reference', 'ai', 'tools', 'apps'];
  function catOf(m) { return CATS.indexOf(m.category) >= 0 ? m.category : (m.type === 'maps' ? 'maps' : m.type === 'app' ? 'apps' : m.type === 'tool' ? 'tools' : 'survival'); }
  function typeLabel(t) { return t === 'model' ? 'AI model' : t === 'app' ? 'App' : t === 'maps' ? 'Map' : t === 'tool' ? 'Tool' : 'Content'; }
  function openHref(m) { return base + (/^\/tools\/[a-z0-9-]+\/$/.test(m.open || '') ? m.open : m.type === 'maps' ? '/maps/' : m.type === 'app' ? '/apps/' : '/wiki/'); }
  function active(m) { return m.job && (m.job.state === 'queued' || m.job.state === 'running'); }

  // ---------- modal ----------
  function openModal(build) {
    var m = $('modal'); m.textContent = ''; build(m); $('veil').classList.add('open');
    var f = m.querySelector('input,button.solid,button'); if (f) f.focus();
  }
  function closeModal() { $('veil').classList.remove('open'); }
  $('veil').addEventListener('mousedown', function (e) { if (e.target === $('veil')) closeModal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeModal(); closeMenus(); } });
  function btn(label, cls, fn) { var b = el('button', 'btn ' + (cls || ''), label); b.type = 'button'; b.addEventListener('click', fn); return b; }

  function askPin(msg) {
    return new Promise(function (resolve, reject) {
      openModal(function (m) {
        m.appendChild(el('h3', null, 'Admin PIN'));
        var mb = el('div', 'mb');
        mb.appendChild(el('div', null, msg || 'Enter the admin PIN to change what is installed on this device.'));
        var inp = el('input', 'field'); inp.type = 'password'; inp.inputMode = 'numeric'; inp.autocomplete = 'off'; inp.maxLength = 12; inp.setAttribute('aria-label', 'Admin PIN');
        var err = el('div', 'note bad'); err.setAttribute('role', 'alert');
        mb.appendChild(inp); mb.appendChild(err);
        mb.appendChild(el('div', 'note', 'The PIN was shown when NorwinPrep was installed. To reset it, run on the device: sudo /opt/norwinprep/scripts/set-admin-pin.sh'));
        m.appendChild(mb);
        var mf = el('div', 'mf');
        var done = false;
        function submit() {
          if (!inp.value) return;
          err.textContent = '';
          api('POST', '/pin', {}, inp.value).then(function () { store(pinKey(), inp.value); done = true; closeModal(); resolve(inp.value); })
            .catch(function (e) { err.textContent = e.message; inp.select(); });
        }
        inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
        mf.appendChild(btn('Cancel', '', function () { closeModal(); reject(new Error('cancelled')); }));
        mf.appendChild(btn('Unlock', 'solid', submit));
        m.appendChild(mf);
      });
    });
  }
  function withPin(fn) {   // run fn(pin); if the saved PIN is wrong/missing, ask and retry once
    if (localMgr) return Promise.resolve().then(function () { return fn(''); });   // your own device: no PIN
    var saved = store(pinKey());
    var go = function (pin) { return fn(pin); };
    var first = saved ? go(saved) : askPin().then(go);
    return first.catch(function (e) {

    });
  }

  // ---------- actions ----------
  function needConnection() {
    if (window.NPApp) window.NPApp.openConnections(browse ? 'Installing is not available on this device yet. You can manage another NorwinPrep device instead.' : 'The device could not be reached. Pick a connection.');
    else toast('This needs a NorwinPrep device.');
  }
  function startInstall(m) {
    if (browse || offline) return needConnection();
    var canBoth = IS_APP && base !== '';          // connected to another device: the app can still install onto this one
    var toLocal = false;
    openModal(function (md) {
      md.appendChild(el('h3', null, (m.installed ? 'Update ' : 'Install ') + m.name));
      var tg = el('div', 'row'); tg.style.cssText = 'display:flex;gap:8px;margin:0 0 10px';
      var mb = el('div', 'mb');
      var mf = el('div', 'mf');
      var tbtns = [];
      if (canBoth) {
        md.appendChild(el('div', 'note', 'Install on:'));
        [[false, 'Connected device'], [true, 'This device']].forEach(function (o) {
          var b = btn(o[1], o[0] === toLocal ? 'solid' : '', function () { toLocal = o[0]; tbtns.forEach(function (x) { x.b.className = 'btn' + (x.v === toLocal ? ' solid' : ''); }); draw(); });
          b.setAttribute('data-target', o[0] ? 'local' : 'remote'); tbtns.push({ b: b, v: o[0] }); tg.appendChild(b);
        });
        md.appendChild(tg);
      }
      md.appendChild(mb); md.appendChild(mf);
      function draw() {
        mb.textContent = ''; mf.textContent = '';
        mb.appendChild(el('div', 'note', 'Checking size and free space…'));
        mf.appendChild(btn('Cancel', '', closeModal));
        var mine = toLocal;
        api('GET', '/info?id=' + encodeURIComponent(m.id), undefined, undefined, mine).then(function (i) {
          if (mine !== toLocal) return;
          mb.textContent = '';
          var dl = el('dl', 'kv');
          [['File', i.file], ['Version', i.version], ['Download', i.bytes ? human(i.bytes) : 'size unknown'], ['Free space', human(i.free)]].forEach(function (r) {
            dl.appendChild(el('dt', null, r[0])); dl.appendChild(el('dd', null, String(r[1])));
          });
          mb.appendChild(dl);
          var tooBig = i.bytes && i.bytes * 1.05 + 52428800 > i.free;
          var rd = state.mods.filter(function (x) { return x.id === 'reader'; })[0];
          var onThis = localMgr || mine;
          if (m.type === 'content' && onThis && (mine || (rd && !rd.installed))) mb.appendChild(el('div', 'note', 'The Content Reader (a small program that shows content packs) is installed first if it is missing.'));
          if (tooBig) mb.appendChild(el('div', 'note bad', 'Not enough free space on ' + (mine ? 'this device' : 'the device') + ' for this download.'));
          else if (i.note) mb.appendChild(el('div', 'note', i.note));
          else mb.appendChild(el('div', 'note', 'Downloads need ' + (mine ? 'this device' : 'the device') + ' to have internet. The download is checked before it is installed.'));
          var go = btn(m.installed && !mine ? 'Update' : 'Install', 'solid', function () {
            closeModal();
            var run = mine ? Promise.resolve().then(function () { return api('POST', '/install', { id: m.id }, '', true); })
                           : withPin(function (pin) { return api('POST', '/install', { id: m.id }, pin); });
            run.then(function () {
              if (mine) toast('Installing ' + m.name + ' on this device. Switch the connection to "This device" to watch it.');
              load();
            }).catch(function (e) { if (e.message !== 'cancelled') toast(e.message); });
          });
          go.disabled = !!tooBig; mf.appendChild(go);
        }).catch(function (e) {
          if (mine !== toLocal) return;
          mb.textContent = '';
          mb.appendChild(el('div', 'bad', mine ? 'This device cannot install modules (' + e.message + ').' : e.message));
        });
      }
      draw();
    });
  }
  function startRemove(m) {
    if (browse || offline) return needConnection();
    openModal(function (md) {
      md.appendChild(el('h3', null, 'Remove ' + m.name + '?'));
      var mb = el('div', 'mb');
      mb.appendChild(el('div', null, 'This deletes ' + (m.files ? m.files.length : 1) + ' file' + ((m.files || []).length === 1 ? '' : 's') + ' (' + human(m.bytes) + ') from this device. You can install it again later.'));
      md.appendChild(mb);
      var mf = el('div', 'mf'); mf.appendChild(btn('Cancel', '', closeModal));
      mf.appendChild(btn('Remove', 'warn', function () {
        closeModal();
        withPin(function (pin) { return api('POST', '/remove', { id: m.id }, pin); }).then(function () { load(); }).catch(function (e) { if (e.message !== 'cancelled') toast(e.message); });
      }));
      md.appendChild(mf);
    });
  }
  function showDetails(m) {
    openModal(function (md) {
      md.appendChild(el('h3', null, m.name));
      var mb = el('div', 'mb'); mb.appendChild(el('div', null, m.description));
      var dl = el('dl', 'kv'); dl.style.marginTop = '14px';
      var rows = [['Type', typeLabel(m.type)], ['From', m.by]].concat(m.minRamGB ? [['Memory needed', 'about ' + m.minRamGB + ' GB']] : []).concat([['Status', m.installed ? 'Installed (v' + m.version + ')' : 'Not installed']]);
      if (m.latest) rows.push(['Latest', 'v' + m.latest]);

      mb.appendChild(dl); md.appendChild(mb);

    });
  }
  function showSettings() {
    openModal(function (md) {
      md.appendChild(el('h3', null, 'Settings'));

        var g = el('div', 'gauge'), i = el('i'); i.style.width = Math.max(1, Math.round(100 * (1 - d.free / d.total))) + '%'; g.appendChild(i); mb.appendChild(g);
      }

      mb.appendChild(el('div', 'note', inst + ' of ' + state.mods.length + ' modules installed.'));

      mb.appendChild(el('div', 'note', hn ? hn + ' module' + (hn === 1 ? ' is' : 's are') + ' hidden in this browser.' : 'No modules are hidden. Use "Hide" in a module\u2019s \u2026 menu to tidy the list.'));
      mb.appendChild(el('div', 'note', localMgr ? 'Modules install on this device, so no PIN is needed.' : store(pinKey()) ? 'This browser remembers your admin PIN.' : 'No admin PIN saved in this browser.'));
      mb.appendChild(el('div', 'note', 'In the NorwinPrep app: press Back (Android) or Ctrl+H (desktop) to return to the device list and change what opens at launch.'));
      md.appendChild(mb);
      var mf = el('div', 'mf');
      mf.appendChild(btn('Close', '', closeModal));
      if (hn) mf.appendChild(btn('Unhide all', '', function () { store(HID_KEY, null); closeModal(); render(); toast('All modules are visible again'); }));
      if (!localMgr && store(pinKey())) mf.appendChild(btn('Forget PIN', 'warn', function () { store(pinKey(), null); closeModal(); toast('PIN forgotten'); }));
      md.appendChild(mf);
    });
  }

  // ---------- rendering ----------
  function closeMenus() { var o = document.querySelectorAll('.menu.open'); for (var i = 0; i < o.length; i++) o[i].classList.remove('open'); }
  document.addEventListener('click', function (e) { if (!e.target.closest('.more') && !e.target.closest('.menu')) closeMenus(); });

  function card(m, installedSection, isHid) {
    var c = el('article', 'card' + (isHid ? ' dim' : '')); c.dataset.id = m.id;
    var top = el('div', 'top');
    var v = el('span', 'ver mono' + (m.updateAvailable ? ' upd' : ''), m.version ? 'V' + m.version : typeLabel(m.type));
    if (m.updateAvailable) v.title = 'Update available: v' + m.latest;
    top.appendChild(v);
    var src = el('a', 'src mono', 'Source ↗'); src.href = m.source; src.target = '_blank'; src.rel = 'noopener noreferrer'; top.appendChild(src);
    c.appendChild(top);
    var body = el('div', 'body');
    var head = el('div', 'head'); head.appendChild(iconEl(m));
    var tt = el('div', 'titles'), title = el('div', 'title'), sp = m.name.indexOf(' ');

    if (sp >= 0) { var n2 = el('span', 'n2', m.name.slice(sp)); n2.style.color = /^#[0-9a-fA-F]{6}$/.test(m.color) ? shade(m.color, 70) : '#8aa4ff'; title.appendChild(n2); }
    title.appendChild(el('span', 'by', 'By ' + m.by));
    tt.appendChild(title); tt.appendChild(el('div', 'tag', m.tagline)); head.appendChild(tt); body.appendChild(head);
    if (!installedSection) { var av = el('div', 'avail'); av.appendChild(el('span', 'pill', 'Available to install')); body.appendChild(av); }
    else if (m.updateAvailable) { var up = el('div', 'avail'); up.appendChild(el('span', 'pill warn', 'Update available')); body.appendChild(up); }
    body.appendChild(el('p', 'desc', m.description));
    body.appendChild(factsEl(m));
    if (m.installed) body.appendChild(el('div', 'meta', 'Last updated: ' + fmtDate(m.updated)));
    else if (m.latest) body.appendChild(el('div', 'meta', 'Latest: v' + m.latest));

    var act = el('div', 'actions');
    if (m.job && (m.job.state === 'queued' || m.job.state === 'running')) {
      var p = el('div', 'prog'), lbl = el('div', 'lbl', (m.job.action === 'remove' ? 'Removing: ' : '') + m.job.message), bar = el('div', 'bar' + (m.job.percent ? '' : ' ind')), fill = el('i');
      fill.style.width = (m.job.percent || 0) + '%'; bar.appendChild(fill); p.appendChild(lbl); p.appendChild(bar); act.appendChild(p);
    } else {
      if (m.job && m.job.state === 'error') act.appendChild(el('div', 'err', m.job.message));
      if (isHid) act.appendChild(btn('Unhide', 'solid', function () { setHidden(m.id, false); render(); }));
      else if (m.installed && m.type === 'tool' && !m.open) { var tb = el('button', 'btn', 'Installed'); tb.type = 'button'; tb.disabled = true; act.appendChild(tb); }

        var tr = stat.transfer, busy = tr && tr.state === 'running', o5 = el('div', 'stopt');
        var b1 = btn('Copy my library to a drive…', 'sm', function () { startXfer('export'); }), b2 = btn('Load a library from a drive…', 'sm', function () { startXfer('import'); }); b1.disabled = b2.disabled = !!busy; o5.appendChild(b1); o5.appendChild(b2); p.appendChild(o5);
        if (tr) { var tb = el('div', 'stbar'), ti = el('i'); ti.style.width = (tr.percent || 0) + '%'; tb.appendChild(ti); if (busy) p.appendChild(tb); p.appendChild(el('div', 'st' + (tr.state === 'error' ? ' bad' : ''), (tr.action === 'export' ? 'Copy: ' : 'Load: ') + tr.message));
          if (busy) p.appendChild(btn('Cancel', 'sm', function () { api('POST', '/transfer-cancel', {}, undefined, true).then(stRender); })); }
      }
      p.scrollTop = keep; clearTimeout(stTimer);
      var xs = stat.transfer && stat.transfer.state === 'running'; if (stOpen) stTimer = setTimeout(stRender, xs ? 1000 : 8000);
    }).catch(function (e) { $('stpanel').textContent = 'Could not load: ' + e.message; });
  }
  function startXfer(action) { api('POST', '/transfer', { action: action }, undefined, true).then(stRender).catch(function (e) { toast(e.message); }); }
  $('stbtn').addEventListener('click', function () { stOpen = !stOpen; if (!stOpen) clearTimeout(stTimer); stRender(); });
  document.addEventListener('click', function (e) { if (stOpen && !e.target.closest('#stpanel') && !e.target.closest('#stbtn') && !e.target.closest('.modal')) { stOpen = false; clearTimeout(stTimer); $('stpanel').style.display = 'none'; } });
  document.addEventListener('keydown', function (e) { if (stOpen && e.key === 'Escape') { stOpen = false; clearTimeout(stTimer); $('stpanel').style.display = 'none'; } });
  function patchProgress() {   // update running bars in place so they don't flicker
    state.mods.forEach(function (m) {
      if (!active(m)) return;
      var c = document.querySelector('.card[data-id="' + m.id + '"]'); if (!c) return;
      var l = c.querySelector('.prog .lbl'), f = c.querySelector('.bar i'), b = c.querySelector('.bar');
      if (l) l.textContent = (m.job.action === 'remove' ? 'Removing: ' : '') + m.job.message;
      if (f) f.style.width = (m.job.percent || 0) + '%';
      if (b) b.classList.toggle('ind', !m.job.percent);
    });
  }

  function schedulePoll() {
    clearTimeout(pollTimer);
    if (state.mods.some(active)) pollTimer = setTimeout(tick, 1000);
    else if (state.pending && state.sizeTries < 40) { state.sizeTries++; pollTimer = setTimeout(tick, 2000); }   // exact sizes are still being looked up
  }
  function connLabel() { return (window.NPApp && window.NPApp.label) ? window.NPApp.label() : (base || 'this device'); }
  function showConn() {
    var c = $('conn'); c.textContent = ''; c.className = 'connbar';
    if (!IS_APP || (!browse && !offline)) return;
    c.classList.add('show'); if (offline) c.classList.add('bad');
    c.appendChild(el('div', 'grow', browse ? "Installing isn't available in this app on this device yet, so you are browsing the catalog. You can still manage another NorwinPrep device from Connections." : "Can't reach " + connLabel() + '. Showing the catalog only.'));
    var b = el('button', 'sq mono', 'Connections'); b.type = 'button'; b.addEventListener('click', function () { window.NPApp.openConnections(); }); c.appendChild(b);
  }
  function failPage(e) {
    var main = $('main'); main.textContent = '';
    var d = el('div', 'empty'); d.appendChild(el('h2', null, 'Module Store is not available here'));
    d.appendChild(el('div', null, 'Open this page from a NorwinPrep device (its Wi-Fi hotspot, or its address), where the module service is running.'));
    d.appendChild(el('div', 'note', 'Technical detail: ' + e.message));
    main.appendChild(d); document.body.setAttribute('data-loaded', 'error');
  }
  function loadStatic() {   // the catalog shipped inside the app: browse without a device
    return fetch('/catalog.json', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('catalog missing'); return r.json(); }).then(function (c) {
      var before = state.sig;
      state.mods = c.modules.filter(function (m) { return (!devPlatform || !m.platforms || m.platforms.indexOf(devPlatform) >= 0) && (!IS_APP || !m.hosts || m.hosts.indexOf('app') >= 0); }).map(function (m) { return { id: m.id, type: m.type, category: m.category, open: m.open, name: m.name, tagline: m.tagline, description: m.description, by: m.by, source: m.source, icon: m.icon, color: m.color, sizeClass: m.sizeClass, installed: false }; });
      state.disk = null; state.pending = false;
      if (signature() !== before) render();
      document.body.setAttribute('data-loaded', '1'); showConn();
    });
  }
  function load() {
    if (browse) return loadStatic().catch(failPage);
    return api('GET', '/catalog').then(function (c) {
      var before = state.sig;
      offline = false;
      state.mods = c.modules; state.disk = c.disk; state.pending = !!c.sizesPending;
      if (signature() !== before) render(); else patchProgress();
      updateQueue();
      document.body.setAttribute('data-loaded', '1'); showConn();
      schedulePoll();
    }).catch(function (e) {
      if (!IS_APP) return failPage(e);
      if (localMgr) { browse = true; return loadStatic().catch(failPage); }   // this app has no module manager here (yet): browse only
      offline = true; return loadStatic().catch(failPage);
    });
  }

  // ---------- controls ----------
  $('chips').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    state.type = b.dataset.t; Array.prototype.forEach.call($('chips').children, function (x) { x.classList.toggle('on', x === b); }); render();
  });
  $('sort').addEventListener('change', function () { state.sort = this.value; store('norwinprep.sort', this.value); render(); });
  $('q').addEventListener('input', function () { state.q = this.value; render(); });
  function setView(v) { state.view = v; store('norwinprep.view', v); $('vgrid').classList.toggle('on', v === 'grid'); $('vlist').classList.toggle('on', v === 'list'); render(); }
  $('vgrid').addEventListener('click', function () { setView('grid'); });
  $('vlist').addEventListener('click', function () { setView('list'); });
  $('gear').addEventListener('click', showSettings);
  $('brand').addEventListener('click', function (e) { e.preventDefault(); goHome(); });
  document.body.classList.add('home');
  $('hiddenBtn').addEventListener('click', function () { state.showHidden = !state.showHidden; render(); });
  $('refresh').addEventListener('click', function () {
    if (browse || offline) return needConnection();
    state.sizeTries = 0;
    var b = this; b.classList.add('spin');
    api('POST', '/refresh', {}).catch(function (e) { if (e.status !== 429) toast(e.message.indexOf('Could not') === 0 ? e.message : 'Could not check for new versions'); })
      .then(function () { return load(); }).then(function () { b.classList.remove('spin'); });
  });

  var sv = store('norwinprep.sort'); if (sv && $('sort').querySelector('option[value="' + sv + '"]')) { state.sort = sv; $('sort').value = sv; }
  if (store('norwinprep.view') === 'list') { state.view = 'list'; $('vgrid').classList.remove('on'); $('vlist').classList.add('on'); }

  // Shared with app-ui.js (the connections icon, connection picker and app updates), which only the apps load.
  window.NPStore = {
    ui: { openModal: openModal, closeModal: closeModal, el: el, btn: btn, toast: toast, human: human },
    reload: function (b) { setBase(b); state.sig = ''; state.sizeTries = 0; return load(); },
    isLocal: function () { return localMgr; }
  };
  function setBase(b) { base = b || ''; browse = false; offline = false; localMgr = IS_APP && base === ''; }
  function loadScript(src) {
    return new Promise(function (res, rej) { var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = function () { rej(new Error('missing ' + src)); }; document.head.appendChild(s); });
  }
  document.body.setAttribute('data-ready', '1');
  fetch('catalog.json', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : {}; }).then(function (j) {
    state.tiers = (Array.isArray(j.tiers) ? j.tiers : []).filter(function (t) { return t && typeof t.id === 'string' && typeof t.name === 'string' && typeof t.blurb === 'string' && Array.isArray(t.modules); })
      .map(function (t) { return { id: t.id.slice(0, 20), name: t.name.slice(0, 30), blurb: t.blurb.slice(0, 300), modules: t.modules.filter(function (x) { return typeof x === 'string'; }) }; });
    state.topics = (Array.isArray(j.topics) ? j.topics : []).filter(function (t) { return t && typeof t.id === 'string' && typeof t.name === 'string' && Array.isArray(t.tiers); })
      .map(function (t) { return { id: t.id.slice(0, 30), name: t.name.slice(0, 40), description: String(t.description || '').slice(0, 200), tiers: t.tiers.filter(function (x) { return x && typeof x.name === 'string' && Array.isArray(x.modules); }).map(function (x) { return { id: String(x.id || '').slice(0, 40), name: x.name.slice(0, 20), recommended: !!x.recommended, modules: x.modules.filter(function (q) { return typeof q === 'string'; }) }; }) }; });
    state.sig = ''; if (state.mods.length) render();
  }).catch(function () { /* no quick setup row */ });
  // Who is serving this page? An app's local instance (mode "local") or a NorwinPrep device itself (mode "pi").
  fetch('/api/device', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; }).then(function (d) {
    if (d && d.mode === 'local') {
      IS_APP = true; devPlatform = d.platform || '';
      return loadScript('/app-ui.js').then(function () { return window.NPApp.start(); }).catch(function () { return null; }).then(setBase);
    }
    setBase('');
  }).then(load);
})();
</script>
