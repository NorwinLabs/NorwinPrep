server {
    listen 80 default_server;
    server_name _;
    root /opt/norwinprep/web;
    index index.html;

    # Captive-portal probes (Android/Apple/Windows) -> send to the portal
    location = /generate_204      { return 302 http://10.42.0.1/; }
    location = /gen_204           { return 302 http://10.42.0.1/; }
    location = /hotspot-detect.html { return 302 http://10.42.0.1/; }
    location = /connecttest.txt   { return 302 http://10.42.0.1/; }
    location = /ncsi.txt          { return 302 http://10.42.0.1/; }

    # Offline wiki / libraries
    location /wiki/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # Drop PDFs, maps, manuals etc. into <content>/library to browse/download them
    location /library/ {
        alias /srv/norwinprep/content/library/;
        autoindex on;
    }

    # Offline map tiles (PMTiles; nginx serves HTTP range requests natively)
    location /tiles/ {
        alias /srv/norwinprep/content/maps/;
        autoindex on;
        autoindex_format json;
        gzip off;
    }

    # Kiwix reader apps + tools for installing from the hotspot
    location /apps/ {
        alias /srv/norwinprep/content/apps/;
        autoindex on;
    }

    location / { try_files $uri $uri/ /index.html; }
}
