name: Build NorwinPrepOS image
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1'   # weekly: picks up fresh Kiwix editions + OS package updates
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y shellcheck
      - run: |
          for f in install.sh scripts/*.sh image/build-image.sh image/stage-norwin/00-install/00-run.sh; do bash -n "$f"; done
          shellcheck -S error install.sh scripts/*.sh image/build-image.sh || true

  build:
    needs: lint
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /
      - run: image/build-image.sh
      - name: Package (split if over the 2 GB release-asset limit)
        run: |
          mkdir -p out && cd out
          cp ../image/pi-gen/deploy/*.img.xz . 2>/dev/null || cp ../image/pi-gen/deploy/*.zip .
          for f in *; do
            if [ "$(stat -c%s "$f")" -gt 1900000000 ]; then split -b 1900M -d "$f" "$f.part" && rm "$f"; fi
          done
          sha256sum * > SHA256SUMS
          ls -lh
      - uses: actions/upload-artifact@v4
        with:
          name: NorwinPrepOS-${{ github.run_number }}
          path: out/*
          retention-days: 14
      - name: Publish release when VERSION has a new tag (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(cat VERSION)"
          if gh release view "$v" >/dev/null 2>&1; then echo "$v already released"; exit 0; fi
          gh release create "$v" out/* --target "$GITHUB_SHA" --title "NorwinPrepOS $v" \
            --notes "Flash with Raspberry Pi Imager (Use custom). If split into .partNN files: cat NorwinPrepOS*.part* > image.img.xz"
