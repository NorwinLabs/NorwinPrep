name: CI and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check scripts
        run: for f in install.sh get.sh uninstall.sh scripts/*.sh; do bash -n "$f"; done
      - name: Module manager tests (installs, resume, checksums, PIN rules, catalog validation)
        run: python3 -W ignore scripts/test_modules_api.py
      - name: ShellCheck (errors only)
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -S error install.sh get.sh uninstall.sh scripts/*.sh
      - name: nginx config test
        run: |
          sudo apt-get install -y nginx
          sudo cp system/nginx/norwinprep.conf /etc/nginx/conf.d/norwinprep.conf
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo mkdir -p /opt/norwinprep/web /srv/norwinprep/content/{library,maps,apps}
          sudo nginx -t

  # ---------- Linux desktop app: x64 + Raspberry Pi (arm64 = Pi OS 64-bit, armv7l = Pi OS 32-bit) ----------
  linux:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/desktop/package-lock.json
      - name: Compute app version (VERSION is MAJOR.MINOR; every push gets its own patch number)
        run: echo "APP_VERSION=$(cat ../../VERSION).${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: "npm ci (retried, because the Electron download from GitHub sometimes answers 504)"
        shell: bash
        run: for i in 1 2 3 4; do npm ci && exit 0; echo "npm ci failed (attempt $i), retrying"; rm -rf node_modules; sleep $((i*15)); done; exit 1
      - run: npm run prepare-assets
      - name: Unit tests (updater, and that every required file is packaged)
        run: |
          node test/updater.test.js
          node test/package-files.test.js
          node test/main-scope.test.js
          node test/library.test.js
          node test/exit-button.test.js
      - name: Module manager, reader and Wi-Fi share tests
        run: |
          node test/modules.test.js
          node test/reader.test.js
          node test/share.test.js
          node test/kolibri.test.js
          node test/ai.test.js
      - name: Smoke test (source)
        run: xvfb-run -a ./node_modules/electron/dist/electron . --no-sandbox --selftest
      - name: Build AppImage + deb for x64, arm64, armv7l
        run: npx electron-builder --linux deb AppImage --x64 --arm64 --armv7l -c.extraMetadata.version="$APP_VERSION" --publish never
      - name: Verify packages and architectures
        run: |
          set -e
          ls -lh dist
          [ "$(ls dist/*.AppImage | wc -l)" -eq 3 ] || { echo "expected 3 AppImages"; exit 1; }
          [ "$(ls dist/*.deb | wc -l)" -eq 3 ] || { echo "expected 3 debs"; exit 1; }
          for f in dist/*.AppImage dist/*.deb; do [ "$(stat -c%s "$f")" -gt 30000000 ] || { echo "$f is suspiciously small"; exit 1; }; done
          [[ "$(file dist/linux-arm64-unpacked/norwinprep)" == *"ARM aarch64"* ]] || { echo "arm64 binary is not aarch64"; exit 1; }
          [[ "$(file dist/linux-armv7l-unpacked/norwinprep)" == *"ARM, EABI5"* ]] || { echo "armv7l binary is not 32-bit ARM"; exit 1; }
          [[ "$(file dist/linux-unpacked/norwinprep)" == *"x86-64"* ]] || { echo "x64 binary is not x86-64"; exit 1; }
          archs="$(for f in dist/*.deb; do dpkg-deb -f "$f" Architecture; done | sort | tr '\n' ' ')"
          [ "$archs" = "amd64 arm64 armhf " ] || { echo "unexpected deb architectures: $archs"; exit 1; }
      - name: Smoke test (packaged x64 build)
        run: timeout 120 xvfb-run -a dist/linux-unpacked/norwinprep --no-sandbox --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: app-linux
          path: |
            app/desktop/dist/*.AppImage
            app/desktop/dist/*.deb
          if-no-files-found: error

  # ---------- Windows ----------
  windows:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/desktop/package-lock.json
      - name: Compute app version
        run: echo "APP_VERSION=$(cat ../../VERSION).${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: "npm ci (retried, because the Electron download from GitHub sometimes answers 504)"
        shell: bash
        run: for i in 1 2 3 4; do npm ci && exit 0; echo "npm ci failed (attempt $i), retrying"; rm -rf node_modules; sleep $((i*15)); done; exit 1
      - run: npm run prepare-assets
      - name: Build installer + portable exe
        run: npx electron-builder --win nsis portable --x64 -c.extraMetadata.version="$APP_VERSION" --publish never
      - name: Verify
        run: |
          set -e
          ls -lh dist
          [ "$(ls dist/*.exe | wc -l)" -eq 2 ] || { echo "expected 2 exe files (installer + portable)"; exit 1; }
          for f in dist/*.exe; do [ "$(stat -c%s "$f")" -gt 30000000 ] || { echo "$f is suspiciously small"; exit 1; }; done
      - name: Smoke test (packaged app)
        continue-on-error: true   # GUI start-up on hosted Windows runners can be flaky; build verification above is the gate
        run: timeout 60 dist/win-unpacked/NorwinPrep.exe --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: app/desktop/dist/*.exe
          if-no-files-found: error

  # ---------- Android ----------
  android:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare Android SDK (preinstalled on the runner)
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SM="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          echo "sdkmanager: $SM"
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SM" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0"
          ls "$SDK/platforms" "$SDK/build-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Compute app version
        run: echo "APP_VERSION=$(cat VERSION).${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Test the Android local server and update client (plain JVM, no SDK needed)
        run: |
          mkdir -p /tmp/jt
          M=app/android/app/src/main/java/com/norwinlabs/norwinprep; T=app/android/app/src/test/java/com/norwinlabs/norwinprep
          javac -d /tmp/jt $M/LocalServer.java $M/ReleaseClient.java $M/MiniJson.java $M/ModuleManager.java $M/ShareServer.java $T/LocalServerTest.java $T/ReleaseClientTest.java $T/ModuleManagerTest.java $T/ShareServerTest.java
          java -cp /tmp/jt com.norwinlabs.norwinprep.LocalServerTest
          java -cp /tmp/jt com.norwinlabs.norwinprep.ReleaseClientTest
          java -cp /tmp/jt com.norwinlabs.norwinprep.ModuleManagerTest
          java -cp /tmp/jt com.norwinlabs.norwinprep.ShareServerTest
      - name: Build signed release APK
        env:
          # optional repository secrets; without them the checked-in keystore (app/android/norwinprep.keystore) is used
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          V="$APP_VERSION"
          gradle -p app/android assembleRelease -PappVersionName="$V" -PappVersionCode="${{ github.run_number }}" --no-daemon --stacktrace
          mkdir -p out
          cp app/android/app/build/outputs/apk/release/app-release.apk "out/NorwinPrep-$V-android.apk"
      - name: Verify APK (signature, package, version)
        run: |
          set -e
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APK="out/NorwinPrep-$APP_VERSION-android.apk"
          "$BT/apksigner" verify --verbose "$APK" | head -5
          "$BT/aapt2" dump badging "$APK" | grep -E "^package: name='com.norwinlabs.norwinprep' .*versionName='$APP_VERSION'"
          # a WebView app with no native libraries is small (tens of KB), so check content, not just size
          [ "$(stat -c%s "$APK")" -gt 10000 ] || { echo "APK suspiciously small"; exit 1; }
          unzip -l "$APK" | grep -q "classes.dex" || { echo "APK has no code"; exit 1; }
          unzip -l "$APK" | grep -q "assets/site/index.html" || { echo "APK is missing assets/site/index.html"; exit 1; }
          "$BT/aapt2" dump permissions "$APK" | grep -q "REQUEST_INSTALL_PACKAGES" || { echo "APK is missing the install permission (needed for in-app updates)"; exit 1; }
          "$BT/aapt2" dump badging "$APK" | grep -E "sdkVersion|uses-permission" | head
      - uses: actions/upload-artifact@v4
        with:
          name: app-android
          path: out/*.apk
          if-no-files-found: error

  # ---------- Release on every push to main ----------
  # Every push publishes one normal release v<MAJOR.MINOR>.<run number> (VERSION holds MAJOR.MINOR).
  # The apps' in-app updater and the Pi's updater both follow the newest release.
  release:
    needs: [linux, windows, android]
    # Linux and Windows are required; Android failing is reported but doesn't block the other platforms
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.linux.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute app version
        run: echo "APP_VERSION=$(cat VERSION).${{ github.run_number }}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Check all expected files are present
        run: |
          set -e
          cd release
          ls -lh
          if [ "$(ls *.apk 2>/dev/null | wc -l)" -eq 1 ]; then echo "APK: present"; else echo "::warning::Android APK is missing from this release (android job: ${{ needs.android.result }})"; fi
          [ "$(ls *.exe | wc -l)" -eq 2 ]
          [ "$(ls *.AppImage | wc -l)" -eq 3 ]
          [ "$(ls *.deb | wc -l)" -eq 3 ]
          sha256sum * > SHA256SUMS
      - name: Publish release (draft, upload each file with retries, then publish)
        run: |
          TAG="v$APP_VERSION"
          # an earlier failed attempt for this tag may have left a half-uploaded release behind
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          created=0
          for i in 1 2 3; do
            if gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "NorwinPrep $TAG" --generate-notes; then created=1; break; fi
            echo "creating the release failed (attempt $i), retrying"; sleep $((i*10))
          done
          [ "$created" = 1 ] || exit 1
          for f in release/*; do
            uploaded=0
            for i in 1 2 3 4; do
              if gh release upload "$TAG" "$f" --clobber; then uploaded=1; break; fi
              echo "uploading $f failed (attempt $i), retrying"; sleep $((i*10))
            done
            [ "$uploaded" = 1 ] || { echo "could not upload $f"; exit 1; }
          done
          gh release edit "$TAG" --draft=false --latest
      - name: Prune old releases (keep newest 25)
        run: |
          gh release list --limit 300 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+(-build\\.[0-9]+)?$"))] | sort_by(.createdAt) | reverse | .[25:] | .[].tagName' \
            | xargs -r -n1 gh release delete --cleanup-tag --yes
