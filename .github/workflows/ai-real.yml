name: AI assistant on a real machine
on:
  workflow_dispatch:
  push:
    paths: ['app/desktop/ai.js', 'app/desktop/modules-manager.js', 'app/desktop/test/ai-real.js', 'app/desktop/test/ollama-real.js', 'app/desktop/test/speech-real.js', 'app/shared/site/ai/index.html', 'app/shared/site/vendor/vosk.js', 'app/desktop/library-search.js', '.github/workflows/ai-real.yml']
jobs:
  real:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install the real engine and a real small model, then ask it a question
        run: node app/desktop/test/ai-real.js
  ollama:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install the real Ollama, a real model and a real Kiwix pack, then ask a question that must use the library
        run: node app/desktop/test/ollama-real.js
  speech:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tools for the test (a synthetic voice, an audio converter, a real browser)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
          cd app/desktop && npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Install the real speech model, speak into a fake microphone, and check the words come out
        run: node app/desktop/test/speech-real.js
